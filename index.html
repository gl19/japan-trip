<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Japan Trip Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style id="app-style">
/* Layout: one column read like a train line. Each day is a numbered stop on a vertical rail; every change of city gets a station-name sign. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --ink:#16202A; --muted:#56636D; --rule:#D2D9D7;
  --accent:#1F5FBF; --on-accent:#FFFFFF; --seal:#C23B22; --on-seal:#FFFFFF; --warn:#8A5A00; --warn-bg:#FCEFD2;
  --scrim:rgba(14,20,24,.48); --on-line:#FFFFFF;
  --board-bg:#12181C; --board-ink:#FFB13B; --board-dim:#C29457;
  --font-display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-body:"IBM Plex Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font-led:"DotGothic16","IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1316; --surface:#162026; --surface-2:#1E2A31; --ink:#E6ECEA; --muted:#9AA8AF; --rule:#2A373E;
    --accent:#86AEF5; --on-accent:#0E1316; --seal:#F0715A; --on-seal:#1A0D0A; --warn:#F2B544; --warn-bg:#33280F;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1316; --surface:#162026; --surface-2:#1E2A31; --ink:#E6ECEA; --muted:#9AA8AF; --rule:#2A373E;
  --accent:#86AEF5; --on-accent:#0E1316; --seal:#F0715A; --on-seal:#1A0D0A; --warn:#F2B544; --warn-bg:#33280F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.modal-open{overflow:hidden}
.app{max-width:900px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 72px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;justify-content:space-between}
.title-block{flex:1 1 320px;min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trip{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,6.4vw,48px);line-height:1.08;letter-spacing:.01em;margin:8px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:12px;font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.facts .linkbtn{font-family:var(--font-body);font-size:13.5px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.person{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 3px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);font-size:13.5px;font-weight:500;line-height:1.2}
.person i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-style:normal;font-size:11px;font-weight:700}
.tk-who{margin:0;font-size:13.5px}
.tk-who .k{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-right:6px}
.viewer{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:22px}
.viewer-label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.vchip{appearance:none;font:inherit;display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;line-height:1.2;cursor:pointer;min-height:32px}
.vchip.all{padding-left:12px}
.vchip i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--ink);font-style:normal;font-size:11px;font-weight:700}
.vchip:hover{border-color:var(--muted)}
.vchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.vchip[aria-pressed="true"] i{background:var(--bg);color:var(--ink)}
.vchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag-who{display:inline-block;font-size:11.5px;font-weight:500;color:var(--muted);border:1px dashed var(--rule);border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.board{flex:0 1 auto;min-width:220px;max-width:100%;display:grid;gap:2px;padding:12px 16px 11px;border-radius:10px;background:var(--board-bg);color:var(--board-ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 1px 0 var(--rule)}
.b-label{font-family:var(--font-led);font-size:12.5px;color:var(--board-dim);letter-spacing:.06em}
.b-big{font-family:var(--font-led);font-size:30px;line-height:1.15;letter-spacing:.04em;text-shadow:0 0 10px rgba(255,177,59,.35)}
.b-small{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.b-clock{font-family:var(--font-mono);font-size:12px;color:var(--board-dim);margin-top:5px;font-variant-numeric:tabular-nums}

.notice{display:flex;gap:10px;align-items:flex-start;margin-top:20px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:14px;line-height:1.5}
.notice svg{width:18px;height:18px;flex:none;color:var(--warn);margin-top:2px}

/* Route strip */
.route-wrap{margin-top:24px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.route{list-style:none;margin:0;padding:0;display:flex;width:max-content;min-width:100%}
.stop{position:relative;flex:1 0 112px}
.stop::before{content:"";position:absolute;top:12px;height:6px;left:0;right:0;background:var(--line)}
.stop:first-child::before{left:50%}
.stop:last-child::before{right:50%}
.stop:only-child::before{display:none}
.stop button{all:unset;box-sizing:border-box;position:relative;display:grid;justify-items:center;text-align:center;gap:1px;width:100%;padding:4px 6px 6px;border-radius:8px;cursor:pointer}
.stop button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stop button:hover .st-en{text-decoration:underline;text-underline-offset:3px}
.st-dot{width:22px;height:22px;border-radius:50%;background:var(--surface);border:5px solid var(--line);margin-bottom:6px}
.st-ja{font-family:var(--font-display);font-size:19px;line-height:1.2;letter-spacing:.06em}
.st-en{font-weight:700;font-size:13px}
.st-n{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.st-nn::before{content:" · "}

/* Phones: slim countdown bar, and the city strip fits the screen instead of scrolling */
@media (max-width:560px){
  .top{gap:12px}
  .board{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;width:100%;min-width:0;padding:8px 12px;border-radius:8px}
  .b-label{font-size:11.5px}
  .b-big{font-size:19px;line-height:1.2}
  .b-small{font-size:11.5px;flex:1 1 auto;min-width:0}
  .b-clock{margin-top:0;font-size:11px;white-space:nowrap}
  .route-wrap{margin-top:16px;overflow-x:visible}
  .route{width:100%;min-width:0}
  .stop{flex:1 1 0;min-width:0}
  .stop:last-child{flex-grow:1.35}
  .stop button{padding:4px 2px 6px}
  .st-ja{font-size:14px;letter-spacing:.02em}
  .st-en{font-size:11px}
  .st-n{font-size:9.5px;white-space:normal;line-height:1.3}
  .st-nn{display:block}
  .st-nn::before{content:none}
  .trip{font-size:27px}
  .route-wrap{padding-bottom:0}
  .tabs{margin-top:8px}
  .vchip{min-height:30px;font-size:13px}
}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:8px;margin-top:18px;padding-block:10px;background:var(--bg);border-bottom:1px solid var(--rule)}
.tablist{display:flex;gap:4px;min-width:0}
.tab{appearance:none;border:0;background:none;font:inherit;font-size:14.5px;font-weight:500;color:var(--muted);padding:7px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .count{font-family:var(--font-mono);font-size:11.5px;opacity:.7}
.tab .count.warn{color:var(--warn);opacity:1;font-weight:600}
.tab[aria-selected="true"] .count{color:inherit;opacity:.75}
.tabs .spacer{flex:1}
@media (max-width:440px){.tab{padding:7px 9px}.tablist{gap:2px}}

/* Buttons */
.btn{appearance:none;font:inherit;font-size:14px;font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:15px;height:15px;flex:none}
.btn.small{font-size:12.5px;padding:5px 9px;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--seal)}
.btn.danger[data-armed]{background:var(--seal);border-color:var(--seal);color:var(--on-seal)}
.btn[disabled]{opacity:.6;cursor:progress}
.iconbtn{appearance:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.btn:focus-visible,.tab:focus-visible,.fchip:focus-visible,.iconbtn:focus-visible,.linkbtn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Station sign */
.sign{margin-top:30px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden;scroll-margin-top:76px}
.sign-name{display:grid;justify-items:center;text-align:center;padding:18px 16px 12px}
.sign-ja{font-family:var(--font-display);font-size:clamp(36px,9vw,54px);line-height:1.05;letter-spacing:.2em;margin-right:-.2em}
.sign-en{font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin-top:6px}
.sign.solo .sign-en{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,7vw,40px);letter-spacing:.04em;text-transform:none;margin-top:0}
.sign-meta{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:6px;text-wrap:balance}
.sign-band{display:flex;justify-content:space-between;gap:14px;min-height:32px;padding:6px 14px;background:var(--line);color:var(--on-line);font-size:13px;font-weight:500}
.sign-band span{min-width:0;overflow-wrap:anywhere}
.sign-band span:last-child{text-align:right}

/* Day */
.day{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:14px;scroll-margin-top:76px}
.rail{position:relative}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:6px;transform:translateX(-50%);background:var(--line)}
.badge{position:relative;margin:18px auto 0;width:46px;height:46px;border-radius:50%;background:var(--surface);border:5px solid var(--line);display:grid;place-content:center;justify-items:center;line-height:1}
.badge small{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;color:var(--muted)}
.badge b{font-family:var(--font-mono);font-size:16px;font-weight:600;margin-top:2px}
.day.is-today .badge{background:var(--line);color:var(--on-line)}
.day.is-today .badge small{color:var(--on-line)}
.day.gap .rail::before{background:repeating-linear-gradient(to bottom, var(--line) 0 8px, transparent 8px 15px)}
.badge b.rng{font-size:12px;letter-spacing:-.03em}
.day-body{min-width:0;padding-block:20px 18px;border-bottom:1px solid var(--rule)}
.day-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.day-head h3{margin:0;font-size:18px;font-weight:700}
.day-ja{color:var(--muted);font-size:13.5px}
.travel{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 8px}
.tonight{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:4px}
.tonight svg{width:15px;height:15px;flex:none}
.free{color:var(--muted);margin:8px 0 0;font-size:14px}

.entries{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.row{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:62px 30px minmax(0,1fr);column-gap:12px;align-items:start;padding:8px 10px 8px 8px;border-radius:10px;cursor:pointer}
.row:hover,.row[aria-expanded="true"]{background:var(--surface)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.t{font-family:var(--font-mono);font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.25;padding-top:5px}
.t .arr{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
.t sup{font-size:9.5px;line-height:0;margin-left:1px}
.t .any{font-size:12px;font-weight:400;color:var(--muted)}
.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.ic svg{width:17px;height:17px}
.what{display:block;min-width:0;padding-top:4px}
.what .title{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.what .sub{display:block;color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:1px;overflow-wrap:anywhere}
.row-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:2px}
.pin{display:grid;place-items:center;width:36px;height:36px;margin-top:4px;border-radius:9px;color:var(--muted);text-decoration:none}
.pin:hover{background:var(--surface);color:var(--accent)}
.pin:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.pin svg{width:18px;height:18px}
.detail{margin:4px 0 10px 104px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
@media (max-width:560px){
  .day{grid-template-columns:40px minmax(0,1fr);column-gap:10px}
  .badge{width:38px;height:38px;border-width:4px}
  .badge b{font-size:14px}
  .rail::before{width:5px}
  .row{grid-template-columns:50px 26px minmax(0,1fr);column-gap:9px;padding-inline:4px 8px}
  .ic{width:26px;height:26px}
  .ic svg{width:15px;height:15px}
  .detail{margin-left:0}
}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;line-height:1;border-radius:999px;padding:3px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap;font-family:var(--font-body);letter-spacing:0;text-transform:none}
.chip.booked{color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal);padding-left:3px}
.seal{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--seal);color:var(--on-seal);font-size:9px;font-weight:700}
.chip.tobook{color:var(--warn);background:var(--warn-bg)}
.chip.maybe{color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule)}
.chip.open{color:var(--muted);background:var(--surface-2)}
.chip.today{background:var(--accent);color:var(--on-accent);margin-left:0}
.tag-sample{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:8px;vertical-align:2px;white-space:nowrap}

/* Detail panel */
.ja-big{font-size:24px;font-weight:700;line-height:1.3;margin:0 0 10px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0}
.kv dt{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap}
.code{font-family:var(--font-mono);font-weight:600;letter-spacing:.06em;margin-right:8px;overflow-wrap:anywhere}
.code.big{font-size:18px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.opts{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.opts-h{margin:0 0 8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opts-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--bg)}
.opt-body{min-width:0}
.opt-name{font-weight:600;overflow-wrap:anywhere}
.opt-name [lang]{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.opt-meta{display:block;color:var(--muted);font-size:13px}
.opt-notes{margin:4px 0 0;font-size:13.5px}
.food-opts{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13.5px}
.food-opts a{color:var(--accent);font-weight:500}
.food-opts span{color:var(--muted)}
@media (max-width:420px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:8px}}

.later{margin-top:8px}
.quiet{color:var(--muted);font-size:14px;margin:10px 0 0}
.foot{margin-top:40px;color:var(--muted);font-size:13px;display:grid;gap:4px}
.foot p{margin:0;max-width:62ch}

/* Bookings */
.section-h{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.section-h::after{content:"";flex:1;height:1px;background:var(--rule)}
.section-h .n{color:var(--ink)}
.todo{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.todo li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--rule)}
.todo li:first-child{border-top:0}
.todo .when{font-family:var(--font-mono);font-size:12.5px;color:var(--warn);padding-top:2px;font-variant-numeric:tabular-nums}
.todo .what{padding-top:0}
.todo .sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:520px){.todo li{grid-template-columns:minmax(0,1fr) auto}.todo .when{grid-column:1/-1;padding:0}}
.tickets{display:grid;gap:12px}
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,auto);background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.tk-main{padding:14px 18px;min-width:0;display:grid;gap:6px;align-content:start}
.tk-eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tk-eyebrow svg{width:15px;height:15px;color:var(--ink)}
.tk-eyebrow .chip{margin-left:4px}
.tk-route{display:flex;align-items:center;flex-wrap:wrap;gap:2px 12px;font-family:var(--font-mono);font-size:28px;font-weight:600;letter-spacing:.04em;line-height:1.15}
.tk-route.names{font-family:var(--font-body);font-size:19px;font-weight:700;letter-spacing:0}
.tk-arrow{color:var(--muted);font-weight:400}
.tk-title{margin:0;font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tk-ja{margin:0;color:var(--muted);font-size:14px}
.tk-times{display:flex;flex-wrap:wrap;gap:2px 18px;font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.tk-times .k{color:var(--muted)}
.tk-notes{margin:0;color:var(--muted);font-size:13.5px}
.tk-stub{position:relative;padding:14px 18px;border-left:2px dashed var(--rule);display:grid;align-content:center;justify-items:start;gap:6px}
.tk-stub::before,.tk-stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--rule)}
.tk-stub::before{top:-9px}
.tk-stub::after{bottom:-9px}
.tk-stub .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tk-stub .btns{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:560px){
  .ticket{grid-template-columns:1fr}
  .tk-stub{border-left:0;border-top:2px dashed var(--rule)}
  .tk-stub::before{top:-9px;left:-9px}
  .tk-stub::after{top:-9px;bottom:auto;left:auto;right:-9px}
  .tk-route{font-size:24px}
}

/* Food */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.fchip{appearance:none;font:inherit;font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.fchip .n{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin-left:3px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fchip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.city-h{display:flex;align-items:center;gap:8px;font-size:17px;margin:28px 0 12px}
.city-h [lang]{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.06em}
.city-dot{width:16px;height:16px;border-radius:50%;border:4px solid var(--line);background:var(--surface);flex:none}
.city-h .n{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:400}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.food{display:grid;gap:6px;align-content:start;min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.food-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.food h4{margin:0;font-size:16.5px;line-height:1.3;overflow-wrap:anywhere}
.food-ja{margin:0;color:var(--muted);font-size:13.5px}
.food-meta{margin:0;font-size:14px}
.food-when{margin:0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.food-when .chip{margin-left:0;vertical-align:0}
.food-notes{margin:0;font-size:13.5px;color:var(--muted)}
.food-by{margin:0;font-size:12.5px;color:var(--muted)}
.food-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.price{font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;white-space:nowrap}
.price .off{opacity:.28}

.empty{text-align:center;padding:56px 16px;display:grid;justify-items:center;gap:8px}
.empty-ja{font-family:var(--font-display);font-size:46px;line-height:1;margin:0;color:var(--muted);opacity:.5;letter-spacing:.2em;margin-right:-.2em}
.empty h2{margin:0;font-size:19px}
.empty p{margin:0;color:var(--muted);max-width:46ch}

/* Modal */
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:min(600px,100%);max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px;padding:20px 20px 0;box-shadow:0 24px 60px rgba(0,0,0,.28);display:grid;gap:16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font-size:20px}
.typepick{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tp{position:relative}
.tp input{position:absolute;opacity:0;width:1px;height:1px}
.tp span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);font-size:13.5px;font-weight:500;cursor:pointer}
.tp span svg{width:15px;height:15px}
.tp input:checked + span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tp input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.req{color:var(--seal)}
.field input,.field select,.field textarea{font:inherit;font-size:16px;line-height:1.35;padding:9px 11px;border-radius:9px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);width:100%;min-width:0;min-height:42px}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.hint{font-size:12px;color:var(--muted)}
.form-err{margin:0;color:var(--seal);font-weight:500;font-size:14px}
.sheet-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding-block:12px 16px;background:var(--surface);border-top:1px solid var(--rule)}
.danger-zone{border-top:1px solid var(--rule);padding-top:14px;display:grid;gap:10px;justify-items:start}
.danger-zone p{margin:0;font-size:14px}
@media (max-width:480px){
  .form-grid{grid-template-columns:1fr}
  .overlay{align-items:flex-end;padding-bottom:0}
  .sheet{border-radius:16px 16px 0 0;max-height:94%}
  .sheet-foot{padding-bottom:max(16px, env(safe-area-inset-bottom, 0px))}
}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;width:max-content;max-width:min(460px, calc(100% - 32px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<script type="application/json" id="trip-data">{
 "name": "Japan, Nov–Dec 2026",
 "start": "2026-11-12",
 "end": "2026-12-02",
 "travelers": ["Xin", "Sheila", "Rohan", "Danny", "Nathan"],
 "items": [
  {"id":"f-ua35","type":"flight","title":"United · UA 35","from":"SFO","to":"KIX","date":"2026-11-12","time":"11:25","endDate":"2026-11-13","endTime":"16:45","status":"booked","who":"Xin, Sheila, Rohan","notes":"Nonstop San Francisco to Osaka Kansai. Departs 11:25, lands 16:45 the next day (times from Rohan's booking).\nFilling in Visit Japan Web before landing speeds up immigration and customs."},
  {"id":"e-kix-arrival","type":"event","title":"Through Kansai Airport: immigration, bags, customs","city":"Osaka","address":"Kansai International Airport, Terminal 1","date":"2026-11-13","time":"16:45","endTime":"18:00","status":"open","by":"Claude","who":"Xin, Sheila, Rohan","notes":"Estimate: 60–90 minutes from landing to walking out, so plan on leaving the terminal around 18:00. It can be quicker or slower depending on how many long-haul flights land at the same time.\nFill in Visit Japan Web before you land and screenshot the QR codes. It saves time at immigration and customs.\nPick up a pocket Wi-Fi or SIM if you need one, and an ICOCA or Suica card if you want one, before heading to the train. Your Suica/ICOCA works on the Nankai line."},
  {"id":"t-kix","type":"transit","title":"Nankai train: Kansai Airport to Namba","from":"Kansai International Airport","to":"Nankai Namba Station","date":"2026-11-13","time":"18:15","endTime":"19:00","status":"open","by":"Claude","who":"Xin, Sheila, Rohan","notes":"Take the Nankai line from the airport station to Nankai Namba, about 40–45 minutes. Two choices: the regular Airport Express (no reservation, about 45 minutes) or the Rapi:t limited express (about 40 minutes, reserved seat with extra fare, and it has space for suitcases). Either works, so take whichever is leaving first.\nFollow the Nankai signs from the arrivals hall to the airport station (a short walk through the connecting building). Trains to Namba run about every 15–30 minutes."},
  {"id":"t-namba-hotel-walk","type":"transit","title":"Walk from Namba Station to the hotel","from":"Nankai Namba Station","to":"UH Suite Namba Station The Spa","date":"2026-11-13","time":"19:00","endTime":"19:20","status":"open","by":"Claude","who":"Xin, Sheila, Rohan","notes":"About 1 km, roughly a 15-minute walk, so you'll be at the hotel around 19:15–19:30. With big suitcases, a taxi from the station is the easy fallback. Check-in is open from 15:00, and the host's number is in Sheila's booking if you need to reach them."},
  {"id":"f-fri13-dinner","type":"food","title":"Dinner near the hotel (pick one)","city":"Osaka","date":"2026-11-13","time":"20:00","status":"maybe","by":"Claude","area":"Namba and Motomachi","cuisine":"5 options","notes":"You should be at the hotel around 19:15–19:30 after the flight, so these are all places to reach in about 10–15 minutes and that stay open late. Listed from nearest to farthest, and the first one is on your way from the train. The vegetarian-friendly ones say so.","options":[{"title":"Itadakimasu","cuisine":"Japanese, meat and vegetable dishes","area":"One minute from Nankai Namba Station","notes":"On your way from the train, so you can eat before the walk to the hotel. Listed 11:00–23:00, last order 22:00. I couldn't confirm vegetarian options, so ask. From online listings, so check hours first.","ja":"肉と野菜の産直ダイニング ITADAKIMASU"},{"title":"Namba Parks restaurants","cuisine":"Casual restaurants, 6th floor","area":"Namba Parks, about a 10-minute walk from the hotel","notes":"Restaurants stay open until about 23:00, although the shops close at 9, and the casual places are on the 6th floor. I haven't picked a specific restaurant, so browse the floor. From online listings, so check hours first."},{"title":"Kura Sushi (Namba Parks South flagship)","cuisine":"Conveyor-belt sushi","area":"Namba Parks South, 2F, about a 10-minute walk from the hotel","notes":"Easy and quick when you're tired, with vegetarian plates (see the Kura Sushi note on the 15th). I don't have its closing time, so check before you go.","ja":"くら寿司 グローバル旗艦店 なんばパークスサウス"},{"title":"Kaisen Monjya Ebizo","cuisine":"Okonomiyaki and monjayaki","area":"Near Namba Station","notes":"Has vegan options, including a vegan okonomiyaki and edamame. Listed hours are 11:00–24:00 on Thursday to Sunday, so it's open on Friday until midnight. A bit further than the other options. From online listings, so check hours first."},{"title":"Gyozaoh (Dotonbori branch)","cuisine":"Vegan-friendly gyoza","area":"Dotonbori, about a 15-minute walk","notes":"Vegetarian-friendly, but one reviewer says it closes at 23:00, so go early if you pick it. From online listings, so check hours first."}]},
  {"id":"h-uh-namba","type":"hotel","title":"UH Suite Namba Station The Spa","city":"Osaka","address":"元町2-7-15 6, Osaka, Osaka Prefecture","date":"2026-11-13","time":"15:00","endDate":"2026-11-16","endTime":"11:00","status":"booked","who":"Sheila, Xin, Rohan, Danny, Nathan","notes":"Booked by Sheila. The host's phone number is in Sheila's booking."},
  {"id":"e-haircut-xin","type":"event","title":"Xin's haircut","city":"Osaka","address":"YUjin Central, Shinsaibashi Fukuho Bldg 3F, 2-6-9 Shinsaibashisuji, Chuo-ku, Osaka 542-0085 (〒542-0085 大阪市中央区心斎橋筋2-6-9 心斎橋福穂ビル 3F)","date":"2026-11-15","time":"14:30","endTime":"15:30","status":"booked","who":"Xin, Sheila","notes":"Haircut for Xin; Sheila is coming along.\nThe calendar invite is in Pacific time (Sat 14 Nov, 9:30–10:30 pm), which is Sun 15 Nov, 14:30–15:30 in Osaka."},
  {"id":"h-richmond-kyoto","type":"hotel","title":"Richmond Hotel Premier Kyoto Ekimae","ja":"リッチモンドホテルプレミア京都駅前","city":"Kyoto","address":"565-3 Kita Fudondo-cho, Shimogyo-ku, Kyoto 600-8233","date":"2026-11-16","time":"14:00","endDate":"2026-11-19","endTime":"11:00","status":"booked","notes":"Booked by Xin through the Bilt Travel Portal. 2 Standard Triple rooms for 5 guests. Non-refundable.\nHotel phone: +81 75-354-3677","who":"Xin, Sheila, Rohan, Danny, Nathan"},
  {"id":"t-kyoto-nara","type":"transit","title":"Kyoto to Nara (Kintetsu line)","from":"Richmond Hotel Premier Kyoto Ekimae","to":"Tōdai-ji, Nara","date":"2026-11-17","time":"08:45","endTime":"10:00","status":"open","by":"Claude","who":"Danny, Xin, Sheila, Nathan, Rohan","notes":"Leave the hotel by about 8:45. Allow 10–15 minutes to reach the Kintetsu platforms, which are on the south (Hachijō) side of Kyoto Station.\nKintetsu Kyoto Line to Kintetsu-Nara: about 35 minutes on a Limited Express (needs an extra reserved-seat ticket), or about 45 minutes on an Express. Check whether your Express runs through to Kintetsu-Nara or needs a change at Yamato-Saidaiji. Suica or ICOCA covers the base fare.\nFrom Kintetsu-Nara it's a 15–20 minute walk through Nara Park to Tōdai-ji, and the deer start right by the station."},
  {"id":"e-nara-todaiji","type":"event","title":"Nara deer feeding + Tōdai-ji Temple","ja":"奈良公園・東大寺","city":"Nara","address":"Tōdai-ji, 406-1 Zōshichō, Nara 630-8587","date":"2026-11-17","time":"10:00","endTime":"13:00","status":"open","who":"Danny, Xin, Sheila, Nathan, Rohan","notes":"Day trip from Kyoto; see the Kintetsu train entry just before this.\nDeer crackers (shika senbei) are sold from carts around the park.\nGetting back: the same Kintetsu line from Kintetsu-Nara to Kyoto, about 35–45 minutes."},
  {"id":"f-nara-lunch","type":"food","title":"Lunch in Nara (pick one)","city":"Nara","date":"2026-11-17","time":"13:00","status":"maybe","by":"Claude","area":"Tōdai-ji to Kintetsu-Nara Station","cuisine":"8 options (4 are vegetarian-focused)","notes":"Listed in walking order from Tōdai-ji back to the station, with vegetarian-focused places at the end. Each has its own Map button.","options":[{"title":"Izasa-chaya (kakinoha-zushi)","ja":"大和まほろば ゐざさ茶屋","cuisine":"Kakinoha-zushi sets","area":"Yumekaze Hiroba 2F, by Tōdai-ji","address":"Yumekaze Hiroba 2F, 16 Kasugano-cho, Nara","price":2,"notes":"Sit-down lunch of Nara's local specialty: sushi wrapped in persimmon leaves. The closest option, steps from Tōdai-ji's entrance. Yumekaze Hiroba has a few other restaurants if it's full. Vegetarian: kakinoha-zushi is usually fish (mackerel or salmon), so ask whether they have a vegetable set."},{"title":"Kamameshi Shizuka","ja":"志津香 公園店","cuisine":"Kamameshi (rice cooked in an iron pot)","area":"Across from the Nara National Museum","address":"59-11 Noboriojicho, Nara 630-8213 (奈良市登大路町59-11)","price":2,"notes":"Nara's best-known kamameshi, cooked to order in individual iron pots, on the walk back from Tōdai-ji toward Kintetsu-Nara Station. Popular, so expect a line and allow extra time while it cooks. Lunch from 11:00; closed Wednesdays (the 17th is a Tuesday). Phone: 0742-27-8030 Vegetarian: kamameshi toppings are usually chicken, beef or seafood and the rice is typically cooked in stock, so ask for a vegetable version."},{"title":"Higashimuki Shopping Street","ja":"東向商店街","cuisine":"Casual cafés, ramen, udon","area":"Next to Kintetsu-Nara Station","address":"Higashimuki Shopping Street, Nara","price":1,"notes":"A covered shopping street right by the station with lots of casual places and shorter waits. Good backup if the others have long lines, and you're already at the train back to Kyoto. Vegetarian: lots of cafés here, so check menus for something meat-free."},{"title":"Nakatanidou mochi (snack)","ja":"中谷堂","cuisine":"Yomogi mochi","area":"Near Kintetsu-Nara Station","address":"29 Hashimotocho, Nara 630-8217","price":1,"notes":"Famous for lightning-fast mochi pounding in front of the shop. Warm mugwort mochi filled with red bean and dusted with kinako. A quick bite on the walk back to the station rather than a full lunch. Open 10:00–19:00. Vegetarian: traditional mochi filled with red bean or dusted with kinako is plant-based."},{"title":"Vegetarian: Kinatei","cuisine":"Vegetarian restaurant (reviewers say fully vegan)","area":"Near Nara Station, about a 5-minute walk per one review","notes":"Set meals with salad, a drink and dessert. From online listings, so check hours first."},{"title":"Vegetarian: Vegan Ramen by Playpen Friends","cuisine":"Vegan ramen","area":"Across from Nara Park, about 800 m from Kintetsu-Nara","notes":"Six vegan ramen choices. Every dish contains onion, scallion or garlic. From online listings, so check hours first."},{"title":"Vegetarian: Azekuraya","cuisine":"Japanese, with vegetarian options","area":"Near Tōdai-ji","notes":"Various vegetarian options, and some dishes can be made vegan. From online listings, so check hours first."},{"title":"Vegetarian: Ban Inoue Todaiji","cuisine":"Café with a vegan burger","area":"Near Tōdai-ji, upstairs café","notes":"Offers a vegan burger. From online listings, so check hours first."}]},
  {"id":"t-kyoto-ishiyama","type":"transit","title":"Kyoto to Ishiyama Station (JR)","from":"Richmond Hotel Premier Kyoto Ekimae","to":"JR Ishiyama Station, Otsu","date":"2026-11-18","time":"08:00","endTime":"08:30","status":"open","by":"Claude","who":"Xin, Sheila","notes":"JR Biwako Line from Kyoto to Ishiyama takes about 15 minutes on a Special Rapid or Rapid train, and Suica or ICOCA works. Leaving the hotel by 8:00 gets you to the North Gate by 8:30 for the 8:40 shuttle."},
  {"id":"t-ishiyama-dmatcha","type":"transit","title":"d:matcha shuttle bus from Ishiyama","from":"JR Ishiyama Station North Gate, Otsu","to":"d:matcha Kyoto, Gonose-142 Yubune, Wazuka, Kyoto 619-1203","date":"2026-11-18","time":"08:40","status":"open","by":"Claude","who":"Xin, Sheila","notes":"The shuttle d:matcha recommends for the tour. It leaves the Ishiyama Station North Gate at 8:40 sharp, so be there by 8:30. No shuttle booking is needed. It's ¥1,500 one way, paid at d:matcha. If you miss it, a taxi is the only other way there. I don't have the ride length; their transportation page has the details."},
  {"id":"e-dmatcha-wazuka","type":"event","title":"Matcha tea farm tour & tasting (d:matcha, Wazuka)","city":"Kyoto","address":"d:matcha Kyoto, Gonose-142 Yubune, Wazuka, Kyoto 619-1203","date":"2026-11-18","time":"09:30","status":"booked","who":"Xin, Sheila","link":"https://dmatcha.com/products/tea-farm-tour-and-tasting-wazuka-kyoto","notes":"Booked for Xin and Sheila. Organic matcha tea farm tour and tasting in Wazuka, about 4 hours: a farm walk with founder Daiki, a tencha factory visit and stone milling, a tasting of 3 matcha and 3 sencha, then a farm-to-table lunch and tea sweets. It runs in English.\nGetting there: take the 8:40 shuttle from Ishiyama Station (see the entry before this one). Kyoto Station to d:matcha is about 60 minutes.\nCancelling: email d:matcha. A full refund needs more than 7 days' notice, which has now passed, so treat it as non-refundable.\nVegetarian: d:matcha says it can accommodate most allergies and food restrictions and has vegan, vegetarian and gluten-free options for the lunch and sweets. Tell them about your diet before the tour (the booking email gives how to contact them).","endTime":"13:30"},
  {"id":"t-dmatcha-back","type":"transit","title":"Back from d:matcha to Kyoto","from":"d:matcha Kyoto, Gonose-142 Yubune, Wazuka, Kyoto 619-1203","to":"Richmond Hotel Premier Kyoto Ekimae","date":"2026-11-18","time":"13:30","status":"open","by":"Claude","who":"Xin, Sheila","notes":"The tour ends at 13:30. d:matcha says Kyoto Station is about 60 minutes away. I couldn't confirm the return shuttle times, so check d:matcha's transportation page or ask them when you're there. A taxi is the fallback."},
  {"id":"t-kyoto-hakone","type":"transit","title":"Kyoto to Hakone","from":"Kyoto","to":"Centurion Hakone Bettei","date":"2026-11-19","time":"11:30","status":"tobook","by":"Claude","notes":"Shinkansen Hikari from Kyoto to Odawara takes about 2 hours (most Nozomi trains don't stop at Odawara). Then the Hakone Tozan Bus from Odawara Station to Sengokuhara takes about an hour.\nLeaving Kyoto around 11:30 gets you to the ryokan in the 15:00–16:00 window.\nHakone Freepass: buy the 3-day pass at Odawara Station when you arrive. It covers the Tozan bus, the ropeway and the pirate ship across your 19th–21st stay. Sources put the Hakone-area 3-day pass around ¥6,400 (¥7,500 if starting from Shinjuku), but prices changed in Oct 2025, so check at the counter. I couldn't confirm the Sengokuhara bus route is covered, so ask when you buy.\nFor a view of Mt. Fuji, book window seat A (left side heading toward Tokyo)."},
  {"id":"h-centurion-hakone","type":"hotel","title":"Centurion Hakone Bettei","ja":"センチュリオン箱根別邸","city":"Hakone","address":"1285-389 Sengokuhara, Hakone, Kanagawa 250-0631 (〒250-0631 足柄下郡箱根町仙石原1285-389)","date":"2026-11-19","time":"15:00","endDate":"2026-11-21","endTime":"11:00","status":"booked","notes":"Ryokan booked by Sheila on Booking.com. 2 Japanese-style Executive Rooms, each with a private open-air bath. Breakfast and sukiyaki dinner are included.\nCheck-in is 15:00–18:00; the booking says we'll arrive between 15:00 and 16:00.\nBooked for 4 adults, but we've called the property and they know there are 5 of us.\nPrice: ¥386,400 for both rooms, not paid yet. Hot spring tax of ¥150 per person per night is paid at the property.\nFree cancellation until 15 Nov 23:59. After that, cancelling costs the first night (¥101,200 per room).\nGuests with tattoos may not be allowed in shared bathing areas.\nPhone: +81 460-84-5122","who":"Xin, Sheila, Rohan, Danny, Nathan"},
  {"id":"t-hk-to-togendai","type":"transit","title":"Ryokan to Togendai Port (Hakone Tozan Bus)","from":"Centurion Hakone Bettei","to":"Togendai Port","date":"2026-11-20","time":"09:15","endTime":"09:40","status":"open","by":"Claude","notes":"Bus from Sengokuhara to Togendai, about 20 minutes. I couldn't confirm the bus schedule, so ask the ryokan front desk for the times or check Google Maps the night before. A taxi is the fallback. Breakfast at the ryokan is included, so eat first."},
  {"id":"t-hk-ship-out","type":"transit","title":"Pirate ship: Togendai to Moto-Hakone (Lake Ashi)","from":"Togendai Port","to":"Moto-Hakone Port","date":"2026-11-20","time":"10:00","endTime":"10:30","status":"open","by":"Claude","notes":"The Hakone Sightseeing Cruise crosses the lake in about 25 minutes. Boats from Togendai leave roughly every 35–40 minutes from about 9:30 (the last one calling at Moto-Hakone is around 16:25). I couldn't find the official November timetable, so check the posted times and take the sailing nearest 10:00. Sit on the upper deck for Fuji views on a clear day."},
  {"id":"e-hk-shrine","type":"event","title":"Hakone Shrine and the lakeside torii","ja":"箱根神社","city":"Hakone","address":"Hakone Shrine, Moto-Hakone, Hakone","date":"2026-11-20","time":"10:45","endTime":"12:15","status":"open","by":"Claude","notes":"From Moto-Hakone Port it's a short walk to the Peace Torii standing in the lake (the classic photo; there's often a line), then up the path through cedar trees to the shrine. The old Tokaido road lined with giant cedar trees (Cedar Avenue) is right next to the port if you have time."},
  {"id":"f-hk-lunch","type":"food","title":"Lunch near Moto-Hakone Port","city":"Hakone","area":"Moto-Hakone","cuisine":"Noodle shops and cafés","price":2,"date":"2026-11-20","time":"12:15","status":"maybe","by":"Claude","notes":"There are plenty of noodle shops and cafés along the lakeside road by the port. I haven't picked a specific restaurant. Tell me if you'd like me to research a few as options.\nVegetarian: reviewers describe a dedicated vegan menu at Hakone Lakeside Eatery, though options aren't always available, and Hakone Nadaman Garden serves mostly vegetable-based shojin (temple) cuisine. Check hours and where each one is on the lake before you go.","options":[{"title":"Hakone Lakeside Eatery","cuisine":"Vegan menu (per reviews)","area":"Lake Ashi","notes":"Vegan options aren't always available, so call ahead if you can. From online listings, so check hours first."},{"title":"Hakone Nadaman Garden","cuisine":"Shojin (Buddhist temple) cuisine","area":"Lake Ashi","notes":"Mostly vegetable-based and can cater to vegan guests, but not strictly vegetarian, so confirm the broth and ingredients. From online listings, so check hours first."}],"optionsLabel":"Vegetarian options"},
  {"id":"t-hk-ship-back","type":"transit","title":"Pirate ship: Moto-Hakone back to Togendai","from":"Moto-Hakone Port","to":"Togendai Port","date":"2026-11-20","time":"14:00","endTime":"14:30","status":"open","by":"Claude","notes":"About 25 minutes. Leave plenty of margin before the last boats (around 16:15 to 16:25), and check the posted times at the port."},
  {"id":"t-hk-ropeway-up","type":"transit","title":"Hakone Ropeway: Togendai to Owakudani","from":"Togendai Port","to":"Owakudani Station","date":"2026-11-20","time":"14:45","endTime":"15:05","status":"open","by":"Claude","notes":"The gondola goes over the Owakudani volcanic valley in about 15–20 minutes. The ropeway can be suspended for volcanic gas or wind, so check its status on the Hakone Ropeway site that morning. Opening hours are about 9:00 to 16:45 (Owakudani station until 17:00)."},
  {"id":"e-hk-owakudani","type":"event","title":"Owakudani volcanic valley and black eggs","ja":"大涌谷","city":"Hakone","address":"Owakudani, Hakone","date":"2026-11-20","time":"15:05","endTime":"16:15","status":"open","by":"Claude","notes":"Steam vents and sulfur smells, plus the famous black eggs boiled in the hot springs (said to add 7 years to your life). It's chilly and breezy up there in November, so bring a layer. If you have time, walk toward the viewpoint for Fuji on a clear day."},
  {"id":"t-hk-home","type":"transit","title":"Owakudani back to the ryokan (ropeway and bus)","from":"Owakudani Station","to":"Centurion Hakone Bettei","date":"2026-11-20","time":"16:15","endTime":"17:15","status":"open","by":"Claude","notes":"Ropeway from Owakudani down to Togendai (last ropeway about 16:45, so don't cut it close), then the Tozan bus from Togendai to Sengokuhara. Check the last bus times at the stop. A taxi from Togendai is the fallback."},
  {"id":"f-hk-dinner","type":"food","title":"Sukiyaki dinner at the ryokan","ja":"夕食 すき焼き","city":"Hakone","area":"Centurion Hakone Bettei","cuisine":"Sukiyaki dinner (included)","price":4,"date":"2026-11-20","status":"booked","notes":"Dinner is included in the room rate, along with breakfast. Confirm the dinner time with the ryokan when you check in, and use the open-air baths before or after.\nVegetarian: sukiyaki is beef-based and ryokan meals use fish stock, so ask the ryokan for a vegetarian, fish-stock-free dinner and breakfast as soon as you can; ryokans usually need notice, and you can phone them on +81 460-84-5122. To say it in Japanese: 私はベジタリアンです。肉、魚、魚のだしは食べられません。 (I'm vegetarian. I can't eat meat, fish or fish stock.)\nIf they can't do it, there are two vegan-friendly places in Sengokuhara, below. For a future trip, Kinnotake Sengokuhara serves a vegan kaiseki dinner.","options":[{"title":"Azure Moon","cuisine":"Café with a vegan curry","area":"Sengokuhara","notes":"One curry and its set menu are vegan; the other curries aren't, so ask. From online listings, so check hours first."},{"title":"Irori Chaya","cuisine":"Vegan-catering restaurant","area":"Sengokuhara","notes":"Listed as catering to vegans. From online listings, so check hours first."}],"optionsLabel":"If the ryokan can't do vegetarian"},
  {"id":"t-hakone-sendai","type":"transit","title":"Hakone to Sendai","from":"Centurion Hakone Bettei","to":"The OneFive Sendai","date":"2026-11-21","time":"11:00","status":"tobook","by":"Claude","who":"Xin, Sheila, Danny, Rohan","notes":"Hakone Tozan Bus from Sengokuhara to Odawara Station (about 1 hour), Shinkansen from Odawara to Tokyo (about 35 minutes on a Hikari), then the Tohoku Shinkansen Hayabusa from Tokyo to Sendai (about 1.5 hours). Allow about 4 hours door to door.\nHayabusa trains are all reserved seats, so book them ahead."},
  {"id":"h-onefive-sendai","type":"hotel","title":"The OneFive Sendai","city":"Sendai","address":"4-6-28 Tsutsujigaoka, Miyagino-ku, Sendai, Miyagi","date":"2026-11-21","time":"15:00","endDate":"2026-11-24","endTime":"10:00","status":"booked","who":"Xin, Sheila, Danny, Rohan","notes":"Booked by Sheila. Check-out is at 10:00, earlier than the other stays."},
  {"id":"h-ici-asakusabashi","type":"hotel","title":"ICI HOTEL Asakusabashi","city":"Tokyo","date":"2026-11-21","endDate":"2026-11-26","status":"booked","who":"Nathan","notes":"Booked by Nathan for himself."},
  {"id":"e-kirin-sendai","type":"event","title":"Kirin Beer Sendai factory tour","ja":"キリンビール仙台工場","city":"Sendai","address":"Kirin Beer Sendai Factory, Sendai","date":"2026-11-22","time":"14:30","endTime":"15:50","status":"booked","who":"Xin, Sheila, Danny, Rohan","link":"https://kirinfactory.revn.jp/guest/login","notes":"Kirin Ichiban Shibori tasting tour, ages 20 and up only, so bring ID. Booked by Sheila for 4 people, ¥4,000 total (¥1,000 each).\nBe at the factory tour reception at least 10 minutes early (by 14:20). Late arrivals may not be let in.\nChanges or cancellations can be made online until 30 minutes before the start, using the reservation ID in Sheila's confirmation email. Cancelling by then gets a full refund."},
  {"id":"t-sendai-tokyo","type":"transit","title":"Sendai to Tokyo","from":"The OneFive Sendai","to":"HOTEL HILLARYS Akasaka","date":"2026-11-24","time":"10:30","status":"tobook","by":"Claude","who":"Xin, Sheila, Danny, Rohan","notes":"Tohoku Shinkansen Hayabusa from Sendai to Tokyo takes about 1.5 hours. Hayabusa trains are all reserved seats, so book ahead.\nFrom Tokyo Station, Akasaka is a short subway ride. Check-out in Sendai is 10:00 and check-in in Akasaka starts at 15:00, so there's time for lunch or bag storage in between."},
  {"id":"h-hillarys-akasaka","type":"hotel","title":"HOTEL HILLARYS Akasaka","city":"Tokyo","address":"3-12-5 Akasaka, Minato-ku, Tokyo","date":"2026-11-24","time":"15:00","endDate":"2026-12-02","endTime":"11:00","status":"booked","who":"Xin, Sheila, Danny, Rohan","notes":"Booked by Sheila on Booking.com for 4 adults: 1 Twin Room and 1 Deluxe Double Room.\nCheck-in is 15:00 to midnight. The lounge is open 15:00–24:00.\nBreakfast isn't included; it's ¥1,200 per person per night. City tax is extra.\nPrice: ¥534,527 for both rooms. Booking.com charges the card automatically (nothing paid yet).\nFree cancellation until 18 Nov 23:59 Japan time. After that, cancelling costs the first night (¥30,811 per room).\nCheck-out on 2 Dec is 11:00, but the flight isn't until 21:25. Ask the front desk to hold bags for the day.\nPhone: +81 3-3582-1050"},
  {"id":"e-capyneko","type":"event","title":"Capybara & Cat café (capyneko Harajuku)","city":"Tokyo","address":"1-6-10 Jingumae, B Square Takeshita Street 2F, Shibuya, Tokyo 150-0001","date":"2026-11-26","time":"13:00","endTime":"13:40","status":"booked","who":"Xin, Sheila, Danny, Rohan","notes":"40-minute capybara and cat session, with one capybara treat each. Booked by Sheila for 4 people; ¥17,600 (¥4,400 each) is already prepaid.\nBe on time: late arrivals don't get extra time or a refund.\nWear socks (or buy a pair there for ¥250), and skip perfume or other strong scents, which are bad for the animals.\nCancellation fees: 10% three days before, 20% two days before, 30% the day before, 100% on the day.\nPhone: 03-6271-5127"},
  {"id":"e-nails-jingumae","type":"event","title":"Sheila's nails","city":"Tokyo","address":"Heights Hekisui Jingumae, 5-18-5 Jingumae, Shibuya, Tokyo 150-0001 (〒150-0001 東京都渋谷区神宮前5-18-5 ハイツ碧水神宮前)","date":"2026-11-26","time":"16:30","endTime":"17:30","status":"booked","who":"Sheila, Xin","notes":"Nail appointment for Sheila, with Xin coming along.\nThe calendar invite is in Pacific time (Wed 25 Nov, 11:30 pm), which is Thu 26 Nov, 16:30–17:30 in Tokyo.\nIt's in Jingumae, the same neighborhood as the capybara café earlier that day, so you can walk over after the café (roughly 10–15 minutes; the distance is an estimate)."},
  {"id":"f-nathan-ph","type":"flight","title":"Nathan's flight to the Philippines","from":"Tokyo","to":"Philippines","date":"2026-11-26","status":"booked","who":"Nathan","notes":"Flight details to come."},
  {"id":"e-soba-ginza","type":"event","title":"Soba noodle making with a master","ja":"そば打ち体験","city":"Tokyo","address":"TRUST VALUE Building, 1-27-7 Ginza, Chuo-ku, Tokyo 104-0061 (〒104-0061 東京都中央区銀座1-27-7 Trust Value銀座一丁目)","date":"2026-11-27","time":"13:00","status":"booked","who":"Xin, Sheila, Danny, Rohan","notes":"Class with a master from a 137-year-old soba house. Booked by Sheila for 4 adults.\nShow the mobile voucher from Sheila's booking app. It's only valid on this date and time.\nFinding it: look for the wine bar Pont du Gard on the ground floor of the TRUST VALUE building.\nVegetarian: soba dipping sauce is normally made with bonito stock, so ask the class (through Sheila's booking) ahead of time whether they can make it vegetarian. To say it in Japanese: 私はベジタリアンです。肉、魚、魚のだしは食べられません。 (I'm vegetarian. I can't eat meat, fish or fish stock.)"},
  {"id":"t-akasaka-narita","type":"transit","title":"Akasaka to Narita Airport","from":"HOTEL HILLARYS Akasaka","to":"Narita Airport Terminal 1","date":"2026-12-02","time":"17:30","status":"open","by":"Claude","who":"Xin, Sheila, Danny, Rohan","notes":"ZIPAIR check-in opens 3 hours before departure (18:25) and closes 60 minutes before (20:25). Leaving Akasaka around 17:30 leaves a buffer.\nOptions: Narita Express from Tokyo Station (about 1 hour), or the Keisei Skyliner from Nippori or Ueno (about 40 minutes). ZIPAIR flies from Terminal 1."},
  {"id":"f-zg026","type":"flight","title":"ZIPAIR · ZG026","from":"NRT","to":"SFO","date":"2026-12-02","time":"21:25","endDate":"2026-12-02","endTime":"13:35","status":"booked","who":"Danny, Xin, Sheila, Rohan","notes":"Departs Narita Terminal 1, arrives SFO International Terminal. Lands earlier the same calendar day thanks to the date line.\nMeals pre-ordered: Xin – unadon (eel rice bowl); Sheila – soba with tempura bits; Rohan – ZIP original wagyu beef curry rice.\nChecked baggage added for all three (30 kg per bag).\nDanny isn't on this booking, so his seat, meal and bags are separate.\nCarry-on: up to 2 items per person, 7 kg total (40×25×55 cm and 35×25×45 cm).\nCheck-in closes 60 minutes before departure; be at the gate 30 minutes before."},
  {"id":"t-namba-castle","type":"transit","title":"Namba to Osaka Castle (Osaka Metro)","from":"UH Suite Namba Station The Spa","to":"Osaka Castle Otemon Gate","date":"2026-11-15","time":"09:30","endTime":"10:00","status":"open","by":"Claude","notes":"Midosuji Line from Namba to Hommachi, then the Chuo Line to Tanimachi 4-chome (about 20 minutes), then about 10 minutes' walk to the Otemon Gate. Suica or ICOCA works."},
  {"id":"s28","type":"event","title":"Osaka Castle","ja":"大阪城","city":"Osaka","address":"1-1 Osakajo, Chuo-ku, Osaka","status":"open","notes":"Suggested order: Otemon Gate and the giant stone walls → main tower (about ¥1,200: a museum on Toyotomi Hideyoshi, with an open-air observation deck at the top) → the 20-minute golden Gozabune boat around the inner moat (about ¥1,500, runs from 10:00, near Gokurakubashi Bridge) → Nishinomaru Garden for the classic photo of the tower (about ¥200–300). Hōkoku Shrine, dedicated to Hideyoshi, is by the Sakuramon Gate.\nThe Osaka Amazing Pass covers the tower, the garden and the boat.\nTower hours change by season (roughly 9:00 to 17:00 or 18:00), so check the official site that week.","date":"2026-11-15","time":"10:00","endTime":"12:30"},
  {"id":"s30","type":"event","title":"Dotonbori afternoon & evening","ja":"道頓堀","city":"Osaka","address":"Dotonbori, Chuo-ku, Osaka","status":"open","notes":"A 10-minute walk from Kuromon Market. Xin and Sheila join after the 14:30 haircut in Shinsaibashi, which is right next to Dotonbori.\nIdeas: the Glico running-man sign from Ebisubashi Bridge; the 20-minute Tombori River Cruise along the canal; Hōzen-ji temple and Hōzenji Yokocho alley (splash water on the moss-covered statue); the Shinsaibashi-suji shopping arcade just north. Snack on takoyaki along the way.\nDinner is at Kura Sushi's Dotonbori branch, right on the strip.","date":"2026-11-15","time":"15:30"},
  {"id":"s20","type":"event","title":"Fushimi Inari Taisha","ja":"伏見稲荷大社","city":"Kyoto","address":"68 Fukakusa Yabunouchicho, Fushimi-ku, Kyoto","status":"open","notes":"Go early to beat the crowds. The full loop to the summit takes 2 to 3 hours; turning back at Yotsutsuji is fine.","by":"Claude"},
  {"id":"s22","type":"event","title":"Kiyomizu-dera & Sannenzaka","ja":"清水寺","city":"Kyoto","address":"1-294 Kiyomizu, Higashiyama-ku, Kyoto","status":"open","notes":"Walk down through Sannenzaka and Ninenzaka toward Gion. The hillside maples usually peak in late November.","by":"Claude"},
  {"id":"s23","type":"event","title":"Arashiyama bamboo grove","ja":"嵐山","city":"Kyoto","address":"Sagaogurayama, Ukyo-ku, Kyoto","status":"open","notes":"JR Sagano Line from Kyoto Station to Saga-Arashiyama. Tenryu-ji garden is next to the grove.","by":"Claude"},
  {"id":"s05","type":"event","title":"Meiji Jingu","ja":"明治神宮","city":"Tokyo","address":"Harajuku, Shibuya-ku, Tokyo","status":"open","notes":"Walk the forest path from Harajuku Station, then Takeshita Street after.","by":"Claude"},
  {"id":"s07","type":"event","title":"Shibuya Sky","city":"Tokyo","address":"Shibuya Scramble Square, 2-24-12 Shibuya, Tokyo","status":"tobook","notes":"Sunset slots sell out. Tickets open online about 4 weeks ahead.","by":"Claude"},
  {"id":"s09","type":"event","title":"teamLab Planets","city":"Tokyo","address":"Toyosu, Koto-ku, Tokyo","status":"tobook","notes":"You wade through knee-deep water, so wear shorts or pants that roll up.","by":"Claude"},
  {"id":"s10","type":"event","title":"Senso-ji & Asakusa","ja":"浅草寺","city":"Tokyo","address":"Asakusa, Taito-ku, Tokyo","status":"open","notes":"Snacks along Nakamise street. Go early or after dark to skip the crowds.","by":"Claude"},
  {"id":"s13","type":"event","title":"Hakone Open-Air Museum","ja":"彫刻の森美術館","city":"Hakone","address":"Ninotaira, Hakone, Kanagawa","status":"open","notes":"Sculpture park with an outdoor foot bath, so bring a small towel.","by":"Claude"},
  {"id":"s29","type":"food","title":"Mizuno","ja":"美津の","city":"Osaka","area":"Dotonbori","cuisine":"Okonomiyaki","price":2,"status":"open","notes":"No reservations; the line moves fast. Try the yamaimo-yaki.","by":"Claude"},
  {"id":"f-kura-dotonbori","type":"food","title":"Kura Sushi (Global Flagship, Dotonbori)","ja":"くら寿司 グローバル旗艦店 道頓堀","city":"Osaka","area":"Dotonbori, 2F","address":"Claude Bldg 2F, 1-4-22 Dotonbori, Chuo-ku, Osaka 542-0071 (大阪市中央区道頓堀1-4-22 クロードビル2F)","cuisine":"Conveyor-belt sushi","price":1,"status":"open","date":"2026-11-15","notes":"Dinner to end the Dotonbori afternoon. Kura Sushi's Dotonbori flagship is decorated to show off Japanese culture, and every 5 plates you drop in the table slot plays the Bikkura-pon prize game.\nSunday dinner is busy. Join the line or book a time in the Kura Sushi app.\nBackup, about 10 minutes' walk from the Osaka stay: the Namba Parks South flagship (2F, 2-11-18 Nambanaka).\nVegetarian: at the belt, look for cucumber and daikon maki, natto maki, tofu nigiri, edamame, fries and desserts (soy-milk ice cream, sesame balls). The menu changes, so check each plate's allergen info on the Kura Sushi tablet or app. Miso soup, udon and ramen broths, dipping sauces and some inari are usually made with fish stock, so ask or skip them. To say it in Japanese: 私はベジタリアンです。肉、魚、魚のだしは食べられません。 (I'm vegetarian. I can't eat meat, fish or fish stock.)\nIf you'd rather eat somewhere vegetarian, tap the options below.","options":[{"title":"Gyozaoh (Dotonbori branch)","cuisine":"Vegan-friendly gyoza","area":"Dotonbori","notes":"A gyoza shop with vegan-friendly options; ask which ones are vegan. From online listings, so check hours first."},{"title":"Mercy Vegan Factory","cuisine":"Vegan comfort food and desserts","area":"Walkable from Dotonbori or Namba Station","notes":"Fully vegan menu. From online listings, so check hours first."},{"title":"Shama Vegetarian Indian Restaurant","cuisine":"Vegetarian Indian","area":"Osaka","notes":"A vegetarian Indian restaurant that guides recommend. From online listings, so check hours first."},{"title":"Pivot Base Cafe & Bar","cuisine":"Café with a good veggie selection","area":"Dotonbori area","notes":"Reviewers praise the vegetarian food. From online listings, so check hours first."},{"title":"Naki Vegan Sweets","cuisine":"Vegan bakery (dessert stop)","area":"Near Dotonbori","notes":"Tiny, about 4 seats, and closed Wednesdays. Good for a sweet, not a meal. From online listings, so check hours first."}],"optionsLabel":"Vegetarian-focused spots nearby"},
  {"id":"t-kura-hotel-walk","type":"transit","title":"Walk back to the hotel","from":"Kura Sushi Dotonbori, 1-4-22 Dotonbori, Osaka","to":"UH Suite Namba Station The Spa","date":"2026-11-15","status":"open","by":"Claude","notes":"About 1 km, roughly a 15–20 minute walk, so you can head back whenever you're done. The distance is an estimate; the Directions button shows the exact route. Dotonbori stays lively late, and the hotel is in the quieter Motomachi area."},
  {"id":"s43","type":"food","title":"Kushikatsu Daruma","ja":"串カツだるま","city":"Osaka","area":"Shinsekai","cuisine":"Kushikatsu","price":1,"status":"open","notes":"Fried skewers. House rule: no double-dipping in the shared sauce.","by":"Claude"},
  {"id":"s44","type":"food","title":"Lunch at Kuromon Market","ja":"黒門市場","city":"Osaka","area":"Nipponbashi","cuisine":"Seafood & street food","price":2,"status":"maybe","notes":"From the castle, about 15–20 minutes by subway to Nippombashi Station, and Dotonbori is a 10-minute walk from here afterwards. Grilled scallops, wagyu skewers, sushi and fruit stalls. Pricey, so share a few bites. Many stalls wind down by late afternoon.\nOther lunch areas:\n• Stay at the castle: MIRAIZA OSAKA-JO, the historic building in front of the tower, or JO-TERRACE OSAKA by Osakajokoen Station. Easiest, no extra travel.\n• Tenjinbashisuji Shopping Street, north of the castle: Japan's longest covered shopping street, full of cheap local restaurants. More local, but out of the way for Dotonbori.\n• Shinsekai, one stop south of Dotonbori: kushikatsu (Kushikatsu Daruma) under Tsutenkaku Tower.\nVegetarian: Kuromon is mostly seafood and meat, so it's a poor fit for a vegetarian lunch. Fruit stalls and sweets work as a snack; check the tamagoyaki (it usually contains fish stock). For a proper vegetarian lunch, try the options below.","date":"2026-11-15","time":"13:00","address":"Kuromon Market, 2-chome Nipponbashi, Chuo-ku, Osaka","options":[{"title":"Gyozaoh (Dotonbori branch)","cuisine":"Vegan-friendly gyoza","area":"Dotonbori","notes":"A gyoza shop with vegan-friendly options; ask which ones are vegan. From online listings, so check hours first."},{"title":"Mercy Vegan Factory","cuisine":"Vegan comfort food and desserts","area":"Walkable from Dotonbori or Namba Station","notes":"Fully vegan menu. From online listings, so check hours first."},{"title":"Shama Vegetarian Indian Restaurant","cuisine":"Vegetarian Indian","area":"Osaka","notes":"A vegetarian Indian restaurant that guides recommend. From online listings, so check hours first."},{"title":"Pivot Base Cafe & Bar","cuisine":"Café with a good veggie selection","area":"Dotonbori area","notes":"Reviewers praise the vegetarian food. From online listings, so check hours first."},{"title":"Naki Vegan Sweets","cuisine":"Vegan bakery (dessert stop)","area":"Near Dotonbori","notes":"Tiny, about 4 seats, and closed Wednesdays. Good for a sweet, not a meal. From online listings, so check hours first."}],"optionsLabel":"Vegetarian lunch alternatives"},
  {"id":"s45","type":"food","title":"Rikuro Ojisan","ja":"りくろーおじさんの店","city":"Osaka","area":"Namba","cuisine":"Jiggly cheesecake","price":1,"status":"open","notes":"Whole cakes fresh from the oven. Good for the Shinkansen ride back.","by":"Claude"},
  {"id":"s21","type":"food","title":"Nishiki Market","ja":"錦市場","city":"Kyoto","area":"Downtown","cuisine":"Market snacks","price":1,"status":"open","notes":"Eat at the stall where you buy. Eating while walking is frowned on here.","by":"Claude"},
  {"id":"s19","type":"food","title":"Pontocho alley dinner","ja":"先斗町","city":"Kyoto","area":"Pontocho","cuisine":"Izakaya & kaiseki","price":3,"status":"maybe","notes":"Narrow lane along the Kamo River. Menus are posted outside, so browse and pick one.","by":"Claude"},
  {"id":"s40","type":"food","title":"Honke Owariya","ja":"本家尾張屋","city":"Kyoto","area":"Karasuma Oike","cuisine":"Soba","price":2,"status":"open","notes":"Shop dating from 1465. Get the hourai soba stacked in lacquer boxes.","by":"Claude"},
  {"id":"s41","type":"food","title":"Kyoto Gogyo","ja":"五行","city":"Kyoto","area":"Downtown","cuisine":"Burnt miso ramen","price":2,"status":"open","notes":"Charred (kogashi) miso ramen, unlike anything in Tokyo.","by":"Claude"},
  {"id":"s42","type":"food","title":"Okutan Nanzenji","ja":"奥丹 南禅寺","city":"Kyoto","area":"Nanzen-ji","cuisine":"Yudofu (simmered tofu)","price":3,"status":"open","notes":"Set menus in a garden setting. Pair it with a walk on the Philosopher's Path.","by":"Claude"},
  {"id":"s04","type":"food","title":"Omoide Yokocho","ja":"思い出横丁","city":"Tokyo","area":"Shinjuku","cuisine":"Yakitori alley","price":1,"status":"open","notes":"Tiny stalls seat 6 to 8, so we may split up. Bring cash.","by":"Claude"},
  {"id":"s06","type":"food","title":"Afuri Harajuku","ja":"阿夫利 原宿","city":"Tokyo","area":"Harajuku","cuisine":"Yuzu shio ramen","price":1,"status":"open","notes":"Order at the ticket machine by the door.","by":"Claude"},
  {"id":"s08","type":"food","title":"Tsukiji Outer Market","ja":"築地場外市場","city":"Tokyo","area":"Tsukiji","cuisine":"Market breakfast","price":2,"status":"open","notes":"Tamagoyaki on a stick, tuna, strawberries. Many stalls close by early afternoon.","by":"Claude"},
  {"id":"s37","type":"food","title":"Fuunji","ja":"風雲児","city":"Tokyo","area":"Shinjuku","cuisine":"Tsukemen","price":1,"status":"open","notes":"Rich dipping ramen. Expect a 30-minute line.","by":"Claude"},

/* ---------- schedule model ---------- */
function buildDays(viewer){
  const dated = trip.items.filter(i => validD(i.date) && visibleTo(i, viewer));

    for (const d of [it.date, validD(it.endDate) ? it.endDate : '']){

    days.push(day); by[d] = day;
  }

      if (by[it.date]) by[it.date].entries.push({ kind: 'checkin', item: it, sk: it.time || '15:00' });
      if (validD(it.endDate) && it.endDate > it.date){
        if (by[it.endDate]){ by[it.endDate].entries.push({ kind: 'checkout', item: it, sk: it.endTime || '11:00' }); if (!by[it.endDate].checkout || coverage(it) > coverage(by[it.endDate].checkout)) by[it.endDate].checkout = it; }
        let d = it.date;

  let prev = '';
  for (const day of days){
    day.entries.sort((a, b) => a.sk < b.sk ? -1 : a.sk > b.sk ? 1 : rank[a.kind] - rank[b.kind]);
    let c = day.night ? (day.night.city || day.night.title || '') : '';

    if (!c){ const m = day.entries.find(e => e.kind === 'main' && (e.item.type === 'event' || e.item.type === 'food') && e.item.city); if (m) c = m.item.city; }

function buildLegs(days, fixed){
