  } else if (e.kind === 'checkin'){
    title = 'Check in · ' + it.title; sub = it.address || ''; time = it.time || '';
  } else if (e.kind === 'checkout'){
    title = 'Check out · ' + it.title; time = it.endTime || '';
  } else {
    time = it.time || '';
    if (it.type === 'flight'){
      title = (it.from || '?') + ' → ' + (it.to || '?'); sub = it.title || '';
      if (it.endTime){
        const dd = validD(it.endDate) ? diffDays(it.date, it.endDate) : 0;
        arr = '→ ' + esc(it.endTime) + (dd > 0 ? '<sup>+' + dd + '</sup>' : '');
      }
    } else if (it.type === 'transit'){
      if (it.from || it.to) sub = (it.from || '?') + ' → ' + (it.to || '?');
      if (it.endTime) arr = '→ ' + esc(it.endTime);
    } else if (it.type === 'event'){
      sub = it.address || '';
      if (it.endTime) arr = '– ' + esc(it.endTime);
    } else if (it.type === 'food'){
      sub = [it.cuisine, it.area].filter(Boolean).join(' · ');
    }
    if (e.unscheduled && it.city) sub = [it.city, sub].filter(Boolean).join(' · ');
  }
  return { title, sub, time, arr };
}
function whenText(it){
  if (it.type === 'hotel'){
    if (!validD(it.date)) return '';
    let s = 'In ' + fmtDay(it.date) + (it.time ? ' ' + it.time : '');
    if (validD(it.endDate)){ const n = diffDays(it.date, it.endDate); s += ' → out ' + fmtDay(it.endDate) + (it.endTime ? ' ' + it.endTime : '') + ' · ' + n + (n === 1 ? ' night' : ' nights'); }
    return s;
  }
  if (it.type === 'flight'){
    if (!validD(it.date)) return '';
    return 'Departs ' + fmtDay(it.date) + (it.time ? ' ' + it.time : '') + (it.endTime ? ' → arrives ' + (validD(it.endDate) ? fmtDay(it.endDate) + ' ' : '') + it.endTime : '') + ' (local times)';
  }
  if (!validD(it.date)) return 'Not scheduled yet';
  return fmtDay(it.date) + (it.time ? ' ' + it.time : '') + (it.endTime ? '–' + it.endTime : '');
}

/* ---------- rendering ---------- */
function render(){
  if (ui.viewer && !canonPerson(ui.viewer)) ui.viewer = '';
  const allDays = buildDays('');
  const B = buildLegs(allDays);
  const days = ui.viewer ? buildDays(ui.viewer) : allDays;
  const L = ui.viewer ? buildLegs(days, B.colors) : B;
  cur = { days, legs: L.legs, colors: Object.assign({}, B.colors, L.colors), order: L.order };
  const app = document.getElementById('app');
  app.innerHTML = viewerBarHtml() + headerHtml() + noticeHtml() + routeHtml() + '<div id="tabs-anchor"></div>' + tabsHtml() + '<main id="view" role="tabpanel" aria-labelledby="tab-' + ui.tab + '">' + viewHtml() + '</main>' + footHtml();
  updateClock();
}
function renderView(){
  const v = document.getElementById('view');
  if (!v){ render(); return; }
  v.innerHTML = viewHtml();
  v.setAttribute('aria-labelledby', 'tab-' + ui.tab);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === ui.tab)));
}
function rerenderKeepScroll(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

function headerHtml(){
  const days = cur.days;
  const facts = [];
  if (days.length){
    facts.push(fmtRange(days[0].date, days[days.length - 1].date));
    facts.push(days.length + (days.length === 1 ? ' day' : ' days'));
    const nights = days.filter(d => d.night).length;
    if (nights) facts.push(nights + (nights === 1 ? ' night' : ' nights'));
    const cities = cur.order.length;
    if (cities) facts.push(cities + (cities === 1 ? ' city' : ' cities'));
  }
  return '<header class="top"><div class="title-block">'
    + '<div class="eyebrow"><span lang="ja">旅のしおり</span> · Trip itinerary</div>'
    + '<h1 class="trip">' + esc(trip.name || 'Japan trip') + '</h1>'
    + '<div class="facts">' + facts.map(f => '<span>' + esc(f) + '</span>').join('')
    + (ui.canEdit ? '<button type="button" class="linkbtn" data-settings>Edit trip details</button>' : '') + '</div>'
    + '</div>' + boardHtml() + '</header>';
}
function viewerBarHtml(){
  const people = travelersList();
  if (!people.length) return '';
  return '<div class="viewer" role="group" aria-label="Whose plans to show"><span class="viewer-label">Plans for</span>'
    + '<button type="button" class="vchip all" data-viewer="" aria-pressed="' + (!ui.viewer) + '">Everyone</button>'
    + people.map(p => '<button type="button" class="vchip" data-viewer="' + esc(p) + '" aria-pressed="' + (ui.viewer === p) + '"><i aria-hidden="true">' + esc(p.charAt(0).toUpperCase()) + '</i>' + esc(p) + '</button>').join('')
    + '</div>';
}
function peopleHtml(){
  const people = travelersList();
  if (!people.length) return '';
  return '<div class="people" role="list" aria-label="Travelers">' + people.map(p => '<span class="person" role="listitem"><i aria-hidden="true">' + esc(p.charAt(0).toUpperCase()) + '</i>' + esc(p) + '</span>').join('') + '</div>';
}
function boardHtml(){
  const days = cur.days;
  let label, big, small;
  if (!days.length){
    label = '準備中 · Planning'; big = 'No dates yet'; small = 'Add a flight or hotel to start';
  } else {
    const first = days[0].date, last = days[days.length - 1].date;
    const now = localNow();
    if (now.date < first){
      const n = diffDays(now.date, first);
      label = '出発まで · Departure in'; big = n === 1 ? '1 day' : n + ' days'; small = 'Leaves ' + fmtDay(first);
    } else if (now.date <= last){
      label = '今日 · Today'; big = 'Day ' + (diffDays(first, now.date) + 1) + ' of ' + days.length;
      const nx = nextUp(now.date, now.time); small = nx || fmtDay(now.date);
    } else {
      label = 'おかえり · Welcome home'; big = 'Trip complete'; small = fmtRange(first, last);
    }
  }
  return '<div class="board" role="status"><span class="b-label" lang="ja">' + esc(label) + '</span><span class="b-big">' + esc(big) + '</span><span class="b-small">' + esc(small) + '</span><span class="b-clock">Japan time <span id="jst">--:--</span></span></div>';
}
function nextUp(date, now){
  const d = cur.days.find(x => x.date === date); if (!d) return '';
  const e = d.entries.find(x => x.sk !== '99:99' && x.sk >= now);
  if (!e) return '';
  const t = describe(e);
  return 'Next: ' + e.sk + ' ' + t.title;
}
function updateClock(){
  const el = document.getElementById('jst'); if (!el) return;
  const j = jstNow(); el.textContent = j.wk + ' ' + j.time;
}
function noticeHtml(){
  const n = trip.items.filter(i => i.sample).length;
  if (!n) return '';
  return '<div class="notice" role="note">' + icon('info') + '<div><strong>This is a sample trip.</strong> Entries tagged “sample” are examples that show how the planner works. '
    + (ui.canEdit ? 'Add your real bookings, then remove the examples in <button type="button" class="linkbtn" data-settings>trip details</button>.' : 'The real plan will replace them soon.')
    + '</div></div>';
}
function routeHtml(){
  const stops = cur.legs.map((l, i) => ({ l, i })).filter(x => x.l.key);
  if (!stops.length) return '';
  return '<nav class="route-wrap" aria-label="Cities on this trip"><ol class="route">' + stops.map(({ l, i }) => {
    const ja = cityJa(l.city), a = l.days[0].date, b = l.days[l.days.length - 1].date;
    return '<li class="stop" style="--line:' + l.color + '"><button type="button" data-jump="' + i + '">'
      + '<span class="st-dot" aria-hidden="true"></span>'
      + (ja ? '<span class="st-ja" lang="ja">' + esc(ja) + '</span>' : '')
      + '<span class="st-en">' + esc(l.city) + '</span>'
      + '<span class="st-n">' + esc(fmtRange(a, b, false)) + (l.nights ? '<span class="st-nn">' + l.nights + 'n</span>' : '') + '</span>'
      + '</button></li>';
  }).join('') + '</ol></nav>';
}
function tabsHtml(){
  const foodN = visibleItems().filter(i => i.type === 'food').length;
  const todoN = visibleItems().filter(i => i.status === 'tobook').length;
  const tab = (id, label, count, warn) => '<button type="button" class="tab" role="tab" id="tab-' + id + '" aria-selected="' + (ui.tab === id) + '" aria-controls="view" data-tab="' + id + '">' + label
    + (count ? '<span class="count' + (warn ? ' warn' : '') + '">' + count + (warn ? '<span class="sr"> still to book</span>' : '') + '</span>' : '') + '</button>';
  return '<div class="tabs"><div class="tablist" role="tablist" aria-label="Views">' + tab('schedule', 'Schedule') + tab('bookings', 'Bookings', todoN, true) + tab('food', 'Food', foodN) + '</div>'
    + '<span class="spacer"></span>'
    + (ui.canEdit ? '<button type="button" class="btn primary" data-add>' + icon('plus') + 'Add</button>' : '')
    + '</div>';
}
function footHtml(){
  return '<footer class="foot"><p>All times are local to where each thing happens. Japan time is UTC+9 all year, with no daylight saving.</p>'
    + (ui.canEdit ? '<p>Tip: paste booking confirmation emails to Claude and ask it to add them here.</p>' : '') + '</footer>';
}
function viewHtml(){
  if (ui.tab === 'bookings') return viewBookings();
  if (ui.tab === 'food') return viewFood();
  return viewSchedule();
}
function emptyHtml(title, text){
  return '<div class="empty"><p class="empty-ja" lang="ja" aria-hidden="true">白紙</p><h2>' + esc(title) + '</h2><p>' + text + '</p></div>';
}

/* Schedule */
function viewSchedule(){
  if (!cur.days.length){
    return emptyHtml('Nothing planned yet', ui.canEdit ? 'Add flights, hotels, trains, activities and restaurants with <b>Add</b>, or paste your booking confirmations to Claude.' : 'Check back soon. The plan is still coming together.') + unscheduledHtml();
  }
  const today = localToday();
  let h = '';
  cur.legs.forEach((leg, i) => {
    h += signHtml(leg, i);
    const ds = leg.days;
    for (let k = 0; k < ds.length; ){
      let j = k;
      while (j < ds.length && !ds[j].entries.length && !ds[j].night) j++;
      if (j - k >= 3){ h += gapHtml(ds.slice(k, j), leg, today); k = j; }
      else { h += dayHtml(ds[k], leg, today); k++; }
    }
  });
  return h + unscheduledHtml();
}
function gapHtml(run, leg, today){
  const a = run[0], b = run[run.length - 1];
  const has = today >= a.date && today <= b.date;
  return '<section class="day gap' + (has ? ' is-today' : '') + '" id="day-' + a.date + '" data-from="' + a.date + '" data-to="' + b.date + '" style="--line:' + leg.color + '" aria-label="Days ' + a.n + ' to ' + b.n + '">'
    + '<div class="rail"><div class="badge" aria-hidden="true"><small>DAYS</small><b class="rng">' + a.n + '–' + b.n + '</b></div></div>'
    + '<div class="day-body"><div class="day-head"><h3>' + esc(fmtDay(a.date)) + ' – ' + esc(fmtDay(b.date)) + '</h3>' + (has ? '<span class="chip today">Today</span>' : '') + '</div>'
    + '<p class="free">' + run.length + ' days with nothing planned yet.' + (ui.canEdit ? ' <button type="button" class="linkbtn" data-add data-preset="hotel" data-date="' + a.date + '">Add a hotel</button>' : '') + '</p>'
    + '</div></section>';
}
function legName(l){
  if (!l) return '';
  if (!l.key) return l.kind === 'tbd' ? 'To be planned' : 'In transit';
  const ja = cityJa(l.city);
  return (ja ? '<span lang="ja">' + esc(ja) + '</span> ' : '') + esc(l.city);
}
function signHtml(leg, i){
  const prev = cur.legs[i - 1], next = cur.legs[i + 1];
  const a = leg.days[0].date, b = leg.days[leg.days.length - 1].date;
  const ja = leg.key ? cityJa(leg.city) : leg.kind === 'tbd' ? '未定' : '移動';
  const meta = [fmtRange(a, b)];
  if (leg.kind === 'tbd' && leg.days.length > 1) meta.push(leg.days.length + ' days');
  if (leg.nights) meta.push(leg.nights + (leg.nights === 1 ? ' night' : ' nights'));
  if (leg.hotels.length) meta.push(leg.hotels.join(' · '));
  return '<div class="sign' + (ja ? '' : ' solo') + '" id="leg-' + i + '" style="--line:' + leg.color + '">'
    + '<div class="sign-name">' + (ja ? '<span class="sign-ja" lang="ja">' + esc(ja) + '</span>' : '')
    + '<span class="sign-en">' + esc(leg.key ? leg.city : leg.kind === 'tbd' ? 'To be planned' : 'In transit') + '</span>'
    + '<span class="sign-meta">' + esc(meta.join(' · ')) + '</span></div>'
    + '<div class="sign-band"><span>' + (prev ? '← ' + legName(prev) : '') + '</span><span>' + (next ? legName(next) + ' →' : '') + '</span></div>'
    + '</div>';
}
function dayHtml(d, leg, today){
  const isToday = d.date === today;
  const hasCheckin = d.entries.some(e => e.kind === 'checkin');
  return '<section class="day' + (isToday ? ' is-today' : '') + '" id="day-' + d.date + '" style="--line:' + leg.color + '" aria-label="Day ' + d.n + ', ' + esc(fmtDay(d.date)) + '">'
    + '<div class="rail"><div class="badge" aria-hidden="true"><small>DAY</small><b>' + d.n + '</b></div></div>'
    + '<div class="day-body"><div class="day-head"><h3>' + esc(fmtDay(d.date)) + '</h3><span class="day-ja" lang="ja">' + esc(fmtDayJa(d.date)) + '</span>'
    + (d.from ? '<span class="travel">' + esc(d.from) + ' → ' + esc(d.city) + '</span>' : '')
    + (isToday ? '<span class="chip today">Today</span>' : '') + '</div>'
    + (d.night && !hasCheckin ? '<div class="tonight">' + icon('hotel') + '<span>Tonight: ' + esc(d.night.title) + '</span></div>' : '')
    + (d.entries.length ? '<ul class="entries">' + d.entries.map(entryHtml).join('') + '</ul>' : '<p class="free">Nothing planned yet.</p>')
    + '</div></section>';
}
function entryHtml(e){
  const it = e.item, key = it.id + '-' + e.kind, open = ui.open.has(key);
  const t = describe(e);
  const timeHtml = e.unscheduled ? '<span class="any">—</span>' : t.time ? esc(t.time) + (t.arr ? '<span class="arr">' + t.arr + '</span>' : '') : '<span class="any">any time</span>';
  const showChip = e.kind === 'main' || e.kind === 'checkin';
  return '<li class="entry"><div class="row-wrap"><button type="button" class="row" data-toggle="' + esc(key) + '" aria-expanded="' + open + '" aria-controls="d-' + esc(key) + '">'
    + '<span class="t">' + timeHtml + '</span>'
    + '<span class="ic" title="' + esc(TYPE_LABEL[it.type] || '') + '">' + icon(it.type) + '</span>'
    + '<span class="what"><span class="title">' + esc(t.title) + '</span>' + (showChip ? chip(it) : '') + sampleTag(it) + whoTag(it)
    + (t.sub ? '<span class="sub">' + esc(t.sub) + '</span>' : '') + '</span>'
    + '</button>' + pinHtml(it, e.kind, t.title) + '</div><div class="detail" id="d-' + esc(key) + '"' + (open ? '' : ' hidden') + '>' + detailsHtml(it, e.kind) + '</div></li>';
}
function codeHtml(code){
  return '<span class="code">' + esc(code) + '</span><button type="button" class="btn small" data-copy="' + esc(code) + '">' + icon('copy') + 'Copy</button>';
}
function linkButtons(it, kind){
  const out = [];
  const a = (url, ic, label) => '<a class="btn small" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + icon(ic) + esc(label) + '</a>';
  if (it.type === 'flight'){
    if (isAirport(it.from)) out.push(a(airportLink(it.from), 'pin', String(it.from).toUpperCase() + ' map'));
    if (isAirport(it.to)) out.push(a(airportLink(it.to), 'pin', String(it.to).toUpperCase() + ' map'));
  } else {
    const ml = mapLink(it, kind); if (ml) out.push(a(ml.url, ml.ic, ml.label));
  }
  const l = safeUrl(it.link); if (l) out.push(a(l, 'ext', 'Link'));
  return out;
}
function optionMapUrl(o, it){
  const q = o.address ? (o.title + ', ' + o.address) : [o.title, o.area, it.city, 'Japan'].filter(Boolean).join(', ');
  return GMAPS + 'search/?api=1&query=' + encodeURIComponent(q);
}
/* An entry can carry "options" (e.g. several lunch spots for one slot); they're listed in its dropdown. */
function optionsHtml(it){
  return '<div class="opts"><p class="opts-h">' + esc(it.optionsLabel || it.options.length + ' options') + '</p><ol class="opts-list">' + it.options.map(o =>
    '<li class="opt"><div class="opt-body"><span class="opt-name">' + esc(o.title) + (o.ja ? '<span lang="ja">' + esc(o.ja) + '</span>' : '') + '</span>'
    + '<span class="opt-meta">' + esc([o.cuisine, o.area].filter(Boolean).join(' · ')) + (o.price ? ' · ' + priceHtml(o.price) : '') + '</span>'
    + (o.notes ? '<p class="opt-notes notes">' + esc(o.notes) + '</p>' : '') + '</div>'
    + '<a class="btn small" href="' + esc(optionMapUrl(o, it)) + '" target="_blank" rel="noopener noreferrer">' + icon('pin') + 'Map</a></li>').join('')
    + '</ol></div>';
}
function optionsCompact(it){
  return (it.optionsLabel ? '<p class="opts-h">' + esc(it.optionsLabel) + '</p>' : '') + '<ul class="food-opts">' + it.options.map(o => '<li><a href="' + esc(optionMapUrl(o, it)) + '" target="_blank" rel="noopener noreferrer">' + esc(o.title) + '</a>' + (o.cuisine ? ' <span>· ' + esc(o.cuisine) + '</span>' : '') + '</li>').join('') + '</ul>';
}
function detailsHtml(it, kind){
  const out = [];
  if (it.ja) out.push('<p class="ja-big" lang="ja">' + esc(it.ja) + '</p>');
  const rows = [];
  const w = whenText(it); if (w) rows.push(['When', esc(w)]);
  if ((it.type === 'flight' || it.type === 'transit') && (it.from || it.to)) rows.push(['Route', esc((it.from || '?') + ' → ' + (it.to || '?'))]);
  if (it.address) rows.push([it.type === 'hotel' ? 'Address' : 'Where', esc(it.address)]);
  if (it.type === 'food'){
    const m = [it.cuisine, it.area].filter(Boolean).join(' · '); if (m) rows.push(['Food', esc(m)]);
    if (it.price) rows.push(['Price', priceHtml(it.price)]);
  }
  if (it.status) rows.push(['Status', esc(statusLabel(it.status, it.type))]);
  if (it.conf) rows.push([it.type === 'transit' ? 'Ticket' : 'Confirmation', codeHtml(it.conf)]);
  if (it.who) rows.push(['Who', esc(it.who)]);
  if (it.by) rows.push(['Recommended by', esc(it.by)]);
  if (it.notes) rows.push(['Notes', '<span class="notes">' + esc(it.notes) + '</span>']);
  if (rows.length) out.push('<dl class="kv">' + rows.map(([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('') + '</dl>');
  if (Array.isArray(it.options) && it.options.length) out.push(optionsHtml(it));
  const acts = linkButtons(it, kind);
  if (ui.canEdit){
    acts.push('<button type="button" class="btn small" data-edit="' + esc(it.id) + '">' + icon('edit') + 'Edit</button>');
    acts.push('<button type="button" class="btn small danger" data-del="' + esc(it.id) + '">' + icon('trash') + 'Delete</button>');
  }
  if (acts.length) out.push('<div class="actions">' + acts.join('') + '</div>');
  return out.join('');
}
function unscheduledHtml(){
  const order = cur.order || [];
  const rankCity = c => { const i = order.indexOf(String(c || '').trim().toLowerCase()); return i < 0 ? 999 : i; };
  const list = visibleItems().filter(i => !validD(i.date) && i.type !== 'food').sort((a, b) => rankCity(a.city) - rankCity(b.city) || String(a.city || '').localeCompare(String(b.city || '')) || String(a.title).localeCompare(String(b.title)));
  const foodN = visibleItems().filter(i => i.type === 'food' && !validD(i.date)).length;
  if (!list.length && !foodN) return '';
  return '<section class="later" aria-labelledby="later-h"><h2 class="section-h" id="later-h">Ideas not on the schedule yet</h2>'
    + (list.length ? '<ul class="entries">' + list.map(it => entryHtml({ kind: 'main', item: it, unscheduled: true })).join('') + '</ul>' : '')
    + (foodN ? '<p class="quiet">Plus ' + foodN + ' restaurant idea' + (foodN === 1 ? '' : 's') + ' in <button type="button" class="linkbtn" data-tab="food">Food</button>.</p>' : '')
    + '</section>';
}

/* Bookings */
function sectionH(title, n){ return '<h2 class="section-h">' + esc(title) + (n != null ? ' <span class="n">' + n + '</span>' : '') + '</h2>'; }
function viewBookings(){
  const items = visibleItems();
  if (!items.length) return emptyHtml('No bookings yet', ui.canEdit ? 'Add a flight or hotel with <b>Add</b> and it will show up here with its confirmation code.' : 'Bookings will show up here once they are made.');
  const todo = items.filter(i => i.status === 'tobook').sort(byWhen);
  const flights = items.filter(i => i.type === 'flight').sort(byWhen);
  const hotels = items.filter(i => i.type === 'hotel').sort(byWhen);
  const transit = items.filter(i => i.type === 'transit').sort(byWhen);
  const res = items.filter(i => (i.type === 'event' || i.type === 'food') && i.status === 'booked').sort(byWhen);
  let h = sectionH('Still to book', todo.length);
  h += todo.length ? '<ul class="todo">' + todo.map(todoRow).join('') + '</ul>' : '<p class="quiet">Nothing left to book.</p>';
  if (flights.length) h += sectionH('Flights', flights.length) + '<div class="tickets">' + flights.map(flightTicket).join('') + '</div>';
  if (hotels.length) h += sectionH('Hotels', hotels.length) + '<div class="tickets">' + hotels.map(hotelTicket).join('') + '</div>';
  if (transit.length) h += sectionH('Trains & transport', transit.length) + '<div class="tickets">' + transit.map(transitTicket).join('') + '</div>';
  if (res.length) h += sectionH('Tickets & reservations', res.length) + '<div class="tickets">' + res.map(resTicket).join('') + '</div>';
  return h;
}
function todoRow(it){
  const when = validD(it.date) ? fmtDay(it.date) + (it.time ? ' ' + it.time : '') : 'No date';
  const sub = [TYPE_LABEL[it.type], it.city, it.notes].filter(Boolean).join(' · ');
  return '<li><span class="when">' + esc(when) + '</span><span class="what"><span class="title">' + esc(it.title) + '</span>' + sampleTag(it) + '<span class="sub">' + esc(sub) + '</span></span>'
    + (ui.canEdit ? '<button type="button" class="btn small" data-markbooked="' + esc(it.id) + '">Mark booked</button>' : '') + '</li>';
}
function stubHtml(it, label){
  const btns = [];
  if (it.conf) btns.push('<button type="button" class="btn small" data-copy="' + esc(it.conf) + '">' + icon('copy') + 'Copy</button>');
  btns.push(...linkButtons(it, 'main'));

function defaultType(){ return ui.tab === 'food' ? 'food' : ui.tab === 'bookings' ? 'flight' : 'event'; }
function openItemForm(item, preset){
  formEditing = !!item && trip.items.some(i => i.id === item.id);
  formDraft = item ? JSON.parse(JSON.stringify(item)) : { type: (preset && preset.type) || defaultType() };
  if (!FIELDS[formDraft.type]) formDraft.type = 'event';
  if (!item && formDraft.type === 'hotel'){ formDraft.time = '15:00'; formDraft.endTime = '11:00'; }
  if (preset) Object.assign(formDraft, preset);
  openModal(itemFormHtml());
}
function collect(){
  const d = Object.assign({}, formDraft);
  const form = modalEl && modalEl.querySelector('#item-form');
  if (!form) return d;
  form.querySelectorAll('[name]').forEach(el => {
    if (el.type === 'radio'){ if (el.checked) d[el.name] = el.value; return; }
    d[el.name] = String(el.value || '').trim();
  });
  return d;
}
function onModalChange(ev){
  if (ev.target.name === 'type' && ev.target.form && ev.target.form.id === 'item-form'){
    const before = formDraft.type;
    const d = collect();
    d.type = ev.target.value;
    if (!formEditing && (!d.status || d.status === defStatus(before))) d.status = defStatus(d.type);
    if (d.type === 'hotel'){ if (!d.time) d.time = '15:00'; if (!d.endTime) d.endTime = '11:00'; }
    formDraft = d;
    modalEl.querySelector('#form-fields').innerHTML = FIELDS[d.type].map(f => fieldHtml(f, d, d.type)).join('');
    showErr('');
  }
}
function showErr(msg){
  const el = modalEl && modalEl.querySelector('#form-err');
  if (!el){ if (msg) toast(msg); return; }
  el.textContent = msg; el.hidden = !msg;
}
function onModalSubmit(ev){
  ev.preventDefault();
  if (ev.target.id === 'item-form') submitItem();
  else if (ev.target.id === 'settings-form') submitSettings();
}
function submitItem(){
  const d = collect(); formDraft = d;
  const fields = FIELDS[d.type] || [];
  const missing = fields.filter(f => f.req && !d[f.k]).map(f => f.label);
  if (missing.length) return showErr('Fill in ' + missing.join(', ') + '.');
  for (const f of fields) if (f.kind === 'date' && d[f.k] && !validD(d[f.k])) return showErr(f.label + ' needs a full date.');
  if (d.type === 'hotel' && d.endDate <= d.date) return showErr('Check-out has to be after check-in.');
  if (d.type === 'flight' && d.endDate && d.endDate < d.date) return showErr('The arrival date can’t be before the departure date.');
  if (d.link && !safeUrl(d.link)) return showErr('The link should be a web address, like https://tabelog.com/…');
  const item = { id: d.id || newId(), type: d.type };
  for (const f of fields){
    let v = d[f.k];
    if (v == null || v === '') continue;
    if (f.kind === 'price'){ v = Math.max(1, Math.min(4, parseInt(v, 10) || 1)); }
    if (f.kind === 'url') v = safeUrl(v);
    if (f.kind === 'who') v = parseNames(v).join(', ');
    if (v !== '' && v != null) item[f.k] = v;
  }
  if (!item.status) item.status = defStatus(item.type);
  if (Array.isArray(d.options) && d.options.length) item.options = d.options;
  if (d.optionsLabel) item.optionsLabel = d.optionsLabel;
  if (d.by) item.by = d.by;
  commit({ op: 'upsert', item });
}
function submitSettings(){
  const form = modalEl.querySelector('#settings-form');
  const name = form.querySelector('#s-name').value.trim();
  const start = form.querySelector('#s-start').value.trim();
  const end = form.querySelector('#s-end').value.trim();
  if (!name) return showErr('Give the trip a name.');
  if (start && !validD(start)) return showErr('First day needs a full date.');
  if (end && !validD(end)) return showErr('Last day needs a full date.');
  if (start && end && end < start) return showErr('The last day can’t be before the first day.');
  const travelers = parseNames(form.querySelector('#s-people').value);
  commit({ op: 'settings', name, start, end, travelers });
}

function applyChange(t, c){

  else if (c.op === 'delete') t.items = t.items.filter(x => x.id !== c.id);

  else if (c.op === 'clearSample') t.items = t.items.filter(x => !x.sample);

  if (c.op === 'delete') return !trip.items.some(i => i.id === c.id);
  if (c.op === 'settings') return trip.name === c.name && (trip.start || '') === (c.start || '') && (trip.end || '') === (c.end || '') && JSON.stringify(travelersList()) === JSON.stringify(c.travelers || []);
  if (c.op === 'clearSample') return !trip.items.some(i => i.sample);
  return true;
}
function stashUi(){ ssSet(K_UI, { tab: ui.tab, foodCity: ui.foodCity, open: [...ui.open], y: window.scrollY, t: Date.now() }); }
function setSaving(on){
  const b = modalEl && modalEl.querySelector('#save-btn');
  if (b){ b.disabled = on; if (on){ b.dataset.label = b.textContent; b.textContent = 'Saving…'; } else if (b.dataset.label){ b.textContent = b.dataset.label; } }
  else if (on) toast('Saving…', 0);
}
async function publishDoc(html){
  try { return await artifactApi.publish(html); }
  catch(e){
    if (e && e.code === 'upstream_error'){ await sleep(600 + Math.random() * 900); return await artifactApi.publish(html); }
    throw e;
  }
}
async function commit(change){
  if (ui.saving) return;
  if (!artifactApi || !ui.canEdit){ showErr('Saving only works on the published page, for people with edit access.'); return; }
  const next = applyChange(JSON.parse(JSON.stringify(trip)), change);
  ui.saving = true; setSaving(true);
  stashUi(); ssSet(K_PENDING, change);
  try {
    await publishDoc(buildDocument(next));
    ssDel(K_PENDING); ssSet(K_FLASH, { msg: 'Saved', t: Date.now() });
    trip = next; ui.saving = false; closeModal(); rerenderKeepScroll(); toast('Saved');
  } catch(e){
    ui.saving = false; setSaving(false);
    const code = e && e.code;
    if (code === 'conflict'){ toast('Someone else saved a moment ago. Loading their version…', 0); return; }
    ssDel(K_PENDING);
    if (RO_CODES.includes(code)){
      ui.canEdit = false; ui.readOnly = true; closeModal(); rerenderKeepScroll();
      toast('This page is view-only for you. Ask the trip owner to add you as an editor.', 6000);
    } else if (code === 'rate_limited') showErr('Saving too often. Wait a few seconds, then save again.');
    else if (code === 'too_large') showErr('The trip is too big to save. Shorten some notes and try again.');
    else showErr('Couldn’t save just now. Check your connection and try again.');
  }
}
function handlePending(){
  const p = ssGet(K_PENDING); ssDel(K_PENDING);
  const f = ssGet(K_FLASH); ssDel(K_FLASH);
  if (p){
    if (isApplied(p)) toast('Saved');
    else if (p.op === 'upsert' && ui.canEdit){
      openItemForm(p.item);
      toast('Someone else saved at the same moment, so your change wasn’t kept. Check it and save again.', 7000);
    } else toast('That change wasn’t saved because someone else saved at the same moment. Try it again.', 6000);
  } else if (f && Date.now() - f.t < 20000) toast(f.msg);
}

/* ---------- toast, copy ---------- */
let toastEl = null, toastTimer = 0;
function toast(msg, ms){
  if (ms === undefined) ms = 3200;
  if (!toastEl){ toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status'); toastEl.setAttribute('aria-live', 'polite'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms);
}
function copyText(text, btn){
  const done = () => { const old = btn.innerHTML; btn.textContent = 'Copied'; setTimeout(() => { btn.innerHTML = old; }, 1400); };
  const fallback = () => {
    const code = btn.parentElement && btn.parentElement.parentElement && btn.parentElement.parentElement.querySelector('.code') || btn.previousElementSibling;
    if (code){ try { const r = document.createRange(); r.selectNodeContents(code); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch(e){} }
    toast('Selected. Press Ctrl+C or ⌘C to copy.');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch(e){ fallback(); }
}

/* ---------- navigation ---------- */
const TAB_IDS = ['schedule', 'bookings', 'food'];
function tabFromHash(){ const h = (location.hash || '').replace('#', ''); return TAB_IDS.includes(h) ? h : ''; }
function setTab(t){
  if (!TAB_IDS.includes(t)) return;
  const changed = t !== ui.tab;
  ui.tab = t;
  lsSet(K_UI, { tab: t, foodCity: ui.foodCity });
  try { if (location.hash !== '#' + t) location.hash = t; } catch(e){}
  if (changed){
    renderView();
    const a = document.getElementById('tabs-anchor');
    if (a){ const top = a.getBoundingClientRect().top + window.scrollY; if (window.scrollY > top) window.scrollTo(0, top); }
  }
}
function reducedMotion(){ try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return true; } }
function jumpTo(id){
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
}
function scrollToToday(){
  const t = localToday();
  let el = document.getElementById('day-' + t);
  if (!el) el = Array.from(document.querySelectorAll('.day.gap')).find(g => g.dataset.from <= t && t <= g.dataset.to);
  if (el) el.scrollIntoView({ block: 'start' });
}

document.addEventListener('click', ev => {
  if (modalEl && ev.target === modalEl){ closeModal(); return; }
  const el = ev.target.closest('[data-viewer],[data-tab],[data-toggle],[data-copy],[data-jump],[data-add],[data-edit],[data-del],[data-markbooked],[data-city],[data-settings],[data-close],[data-clear-sample]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.viewer !== undefined){ ui.viewer = canonPerson(ds.viewer); lsSet(VIEW_KEY, ui.viewer); ui.open.clear(); rerenderKeepScroll(); return; }
  if ('close' in ds){ closeModal(); return; }
  if (ds.copy !== undefined){ copyText(ds.copy, el); return; }
  if (ds.tab){ setTab(ds.tab); return; }
  if (ds.toggle){
    const key = ds.toggle, panel = document.getElementById('d-' + key);
    const open = el.getAttribute('aria-expanded') !== 'true';
    el.setAttribute('aria-expanded', String(open));
    if (panel) panel.hidden = !open;
    if (open) ui.open.add(key); else ui.open.delete(key);
    return;
  }
  if (ds.jump !== undefined){ if (ui.tab !== 'schedule') setTab('schedule'); jumpTo('leg-' + ds.jump); return; }
  if ('add' in ds){ if (ui.canEdit) openItemForm(null, ds.preset ? Object.assign({ type: ds.preset }, ds.date ? { date: ds.date } : {}) : null); return; }
  if (ds.edit){ const it = trip.items.find(i => i.id === ds.edit); if (it && ui.canEdit) openItemForm(it); return; }
  if (ds.markbooked){ const it = trip.items.find(i => i.id === ds.markbooked); if (it && ui.canEdit) openItemForm(it, { status: 'booked' }); return; }
  if (ds.del){
    if (!ui.canEdit) return;
    if (!el.hasAttribute('data-armed')){
      el.setAttribute('data-armed', '');
      el.innerHTML = icon('trash') + 'Tap again to delete';
      setTimeout(() => { if (document.contains(el)){ el.removeAttribute('data-armed'); el.innerHTML = icon('trash') + 'Delete'; } }, 4000);
      return;
    }
    commit({ op: 'delete', id: ds.del });
    return;
  }
  if (ds.city !== undefined){ ui.foodCity = ds.city; lsSet(K_UI, { tab: ui.tab, foodCity: ui.foodCity }); renderView(); return; }
  if ('settings' in ds){ if (ui.canEdit) openModal(settingsFormHtml()); return; }
  if ('clearSample' in ds){
    if (!el.hasAttribute('data-armed')){
      el.setAttribute('data-armed', '');
      el.innerHTML = icon('trash') + 'Tap again to remove them';
      setTimeout(() => { if (document.contains(el)){ el.removeAttribute('data-armed'); el.innerHTML = icon('trash') + 'Remove sample entries'; } }, 4000);
      return;
    }
    commit({ op: 'clearSample' });
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && modalEl) closeModal(); });
window.addEventListener('hashchange', () => { const t = tabFromHash(); if (t && t !== ui.tab){ ui.tab = t; renderView(); } });

/* ---------- start ---------- */
const keep = lsGet(K_UI) || {};
const stash = ssGet(K_UI) || {};
const recent = stash.t && Date.now() - stash.t < 60000;
ui.tab = tabFromHash() || (recent && stash.tab) || keep.tab || 'schedule';
if (!TAB_IDS.includes(ui.tab)) ui.tab = 'schedule';
ui.foodCity = (recent && stash.foodCity) || keep.foodCity || 'all';
ui.viewer = canonPerson(lsGet(VIEW_KEY) || '');
if (recent && Array.isArray(stash.open)) stash.open.forEach(k => ui.open.add(k));
render();
if (recent && typeof stash.y === 'number') requestAnimationFrame(() => window.scrollTo(0, stash.y));
else if (ui.tab === 'schedule') scrollToToday();
ssDel(K_UI);
setInterval(updateClock, 15000);

(async function initCaps(){
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ handlePending(); return; }
  try {
    const [art, usr] = await Promise.all([c.use('artifact').catch(() => null), c.use('user').catch(() => null)]);
    artifactApi = art || null;
    let can = null;
    if (usr && typeof usr.canEdit === 'function'){ try { can = await usr.canEdit(); } catch(e){ can = null; } }
    ui.canEdit = !!artifactApi && can !== false && !ui.readOnly;
  } catch(e){ ui.canEdit = false; }
  if (ui.canEdit) rerenderKeepScroll();
  handlePending();
})();
})();
</script>
